<svg xmlns="http://www.w3.org/2000/svg" width="420" height="240" viewBox="0 0 420 240">
  <rect width="420" height="240" rx="14" fill="#15151c"/>

  <!-- map grid -->
  <g stroke="#20202b" stroke-width="1">
    <line x1="0" y1="40" x2="420" y2="40"/><line x1="0" y1="80" x2="420" y2="80"/>
    <line x1="0" y1="120" x2="420" y2="120"/><line x1="0" y1="160" x2="420" y2="160"/>
    <line x1="60" y1="20" x2="60" y2="200"/><line x1="120" y1="20" x2="120" y2="200"/>
    <line x1="180" y1="20" x2="180" y2="200"/><line x1="240" y1="20" x2="240" y2="200"/>
    <line x1="300" y1="20" x2="300" y2="200"/><line x1="360" y1="20" x2="360" y2="200"/>
  </g>

  <!-- red zone: pulsing -->
  <circle cx="300" cy="70" r="34" fill="#e03a3a" opacity="0.25">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="30;38;30" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="70" r="12" fill="#e03a3a" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="300" y="112" font-family="'Courier New', monospace" font-size="10" fill="#e06666" text-anchor="middle">RED ZONE</text>

  <!-- player marker -->
  <g transform="translate(150,120)">
    <circle r="6" fill="#ffffff"/>
    <circle r="10" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="10s" repeatCount="indefinite"/>
      <line x1="-16" y1="0" x2="-10" y2="0" stroke="#ffb900" stroke-width="2"/>
      <line x1="10" y1="0" x2="16" y2="0" stroke="#ffb900" stroke-width="2"/>
      <line x1="0" y1="-16" x2="0" y2="-10" stroke="#ffb900" stroke-width="2"/>
      <line x1="0" y1="10" x2="0" y2="16" stroke="#ffb900" stroke-width="2"/>
    </g>
    <text x="0" y="30" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">YOU</text>
  </g>

  <!-- zone: breathing -->
  <circle cx="150" cy="120" r="95" fill="none" stroke="#4fc3f7" stroke-width="2.5">
    <animate attributeName="r" values="95;42;95" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="120" r="42" fill="none" stroke="#4fc3f7" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.55"/>

  <!-- status -->
  <text x="210" y="222" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#4fc3f7" text-anchor="middle" letter-spacing="3">THE ZONE IS CLOSING</text>
  <text x="210" y="236" font-family="'Courier New', monospace" font-size="9.5" fill="#5d7d9a" text-anchor="middle">rotate early — read logs like the minimap</text>
</svg>
