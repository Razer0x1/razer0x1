<svg xmlns="http://www.w3.org/2000/svg" width="640" height="170" viewBox="0 0 640 170">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c98a00"/>
      <stop offset="35%" stop-color="#ffb900"/>
      <stop offset="55%" stop-color="#fff3b0"/>
      <stop offset="75%" stop-color="#ffb900"/>
      <stop offset="100%" stop-color="#c98a00"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 0.6 0; 0 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="640" height="170" rx="14" fill="#15151c"/>
  <rect x="8" y="8" width="624" height="154" rx="10" fill="none" stroke="#ffb900" stroke-width="1.5" opacity="0.35"/>
  <rect x="14" y="14" width="612" height="142" rx="8" fill="none" stroke="#ffb900" stroke-width="0.8" opacity="0.2"/>

  <text x="320" y="76" font-family="'Courier New', monospace" font-size="40" font-weight="bold" fill="url(#gold)" text-anchor="middle" letter-spacing="6">WINNER WINNER</text>
  <text x="320" y="124" font-family="'Courier New', monospace" font-size="40" font-weight="bold" fill="url(#gold)" text-anchor="middle" letter-spacing="6">CHICKEN DINNER</text>

  <!-- glint sweeping over the title -->
  <rect x="200" y="40" width="60" height="90" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0.14;0" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="180;460;180" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- pixel chicken -->
  <g transform="translate(548,84)">
    <animateTransform attributeName="transform" type="translate" values="548,84; 548,76; 548,84" dur="2.4s" repeatCount="indefinite"/>
    <rect x="8" y="6" width="26" height="20" rx="4" fill="#f2c14e"/>
    <rect x="30" y="-4" width="14" height="14" rx="3" fill="#f2c14e"/>
    <rect x="33" y="-10" width="4" height="6" fill="#e03a3a"/>
    <rect x="38" y="-11" width="4" height="7" fill="#e03a3a"/>
    <rect x="31" y="0" width="4" height="4" fill="#1b1b22"/>
    <rect x="6" y="0" width="8" height="14" rx="2" fill="#e6b400"/>
    <rect x="0" y="4" width="6" height="10" rx="2" fill="#e6b400"/>
    <rect x="12" y="26" width="4" height="8" fill="#e6b400"/>
    <rect x="22" y="26" width="4" height="8" fill="#e6b400"/>
    <rect x="42" y="6" width="6" height="4" fill="#e6b400"/>
  </g>

  <!-- confetti -->
  <g opacity="0.9">
    <rect x="70" y="-10" width="5" height="9" fill="#ffb900"><animate attributeName="y" values="-10;180" dur="4s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.2" dur="4s" begin="0s" repeatCount="indefinite"/></rect>
    <rect x="130" y="-10" width="4" height="8" fill="#3060c0"><animate attributeName="y" values="-10;180" dur="5.2s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.2" dur="5.2s" begin="0.6s" repeatCount="indefinite"/></rect>
    <rect x="205" y="-10" width="5" height="9" fill="#9be9a8"><animate attributeName="y" values="-10;180" dur="4.6s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.2" dur="4.6s" begin="1.1s" repeatCount="indefinite"/></rect>
    <rect x="275" y="-10" width="4" height="8" fill="#ffb900"><animate attributeName="y" values="-10;180" dur="5.6s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.2" dur="5.6s" begin="0.3s" repeatCount="indefinite"/></rect>
    <rect x="350" y="-10" width="5" height="9" fill="#e6b400"><animate attributeName="y" values="-10;180" dur="4.3s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.2" dur="4.3s" begin="1.6s" repeatCount="indefinite"/></rect>
    <rect x="430" y="-10" width="4" height="8" fill="#ffffff"><animate attributeName="y" values="-10;180" dur="5s" begin="0.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.2" dur="5s" begin="0.9s" repeatCount="indefinite"/></rect>
    <rect x="500" y="-10" width="5" height="9" fill="#3060c0"><animate attributeName="y" values="-10;180" dur="4.8s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.2" dur="4.8s" begin="2s" repeatCount="indefinite"/></rect>
  </g>
</svg>
