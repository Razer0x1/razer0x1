name: contribution snake

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate snake.gif-style svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Razer0x1
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#ffb900&color_dots=#20202b,#4d4d2e,#806a00,#c99a00,#ffb900
      - name: publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
